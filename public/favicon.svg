<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="appleBg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="256" y1="0" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="88" y="104" width="336" height="328" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001D4D" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#appleBg)" />
  <rect width="512" height="512" rx="115" fill="url(#glassSheen)" />
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />

  <!-- Minimalist Productivity Card & Check Emblem -->
  <g filter="url(#softShadow)">
    <rect x="112" y="120" width="288" height="272" rx="56" fill="#FFFFFF" />
    <!-- Top Accent Bar (Finance / Focus) -->
    <rect x="156" y="172" width="96" height="18" rx="9" fill="#007AFF" fill-opacity="0.18" />
    <circle cx="336" cy="181" r="14" fill="#34C759" />

    <!-- Crisp Checkmark -->
    <path
      d="M178 274L228 322L334 216"
      stroke="#007AFF"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
